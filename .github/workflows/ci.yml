name: CI

# Phase 0's last bullet (BUILD_ORDER §2). Runs the headless suites — the ones that need
# nothing but a .NET SDK. The Unity EditMode suite is deliberately not here: it needs a
# licensed Unity runner, and paying that cost buys four tests today. Revisit when the
# Unity side is load-bearing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. main is exempt, so its history
# keeps a result for every commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  headless:
    name: Headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Ubuntu on pull requests; both on pushes to main.
    #
    # Determinism across runtimes is a correctness property here, not portability hygiene —
    # saves are a seed plus a command log (§6.1) — so Windows keeps a thread in CI. But it is
    # the expensive thread: this repo is private, so minutes are metered and Windows bills at
    # twice the Linux rate, for a job that also takes about twice as long. Paying that on every
    # push to a branch buys little, since the Windows suite already runs locally on every
    # change and Linux is the *stricter* environment anyway — case-sensitive paths, LF endings.
    #
    # So PRs get fast feedback, and main gets the cross-runtime check on the commits that
    # actually become history.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore dotnet/RTS.Headless.slnx

      # Through the same entry point developers use, so CI cannot drift from `tools\test`.
      - name: Test
        shell: pwsh
        run: ./tools/Run-Tests.ps1 -ResultsDirectory ${{ runner.temp }}/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 14
